[project]
name = "pydantic-ai-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "akshay.ranganath@glean.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "fastapi>=0.141.1",
    "logfire[fastapi]>=5.1.0",
    "pydantic-ai>=2.44.0",
    "pydantic-ai-slim[duckduckgo,mcp]>=2.44.0",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
pydantic-ai-tutorial = "pydantic_ai_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
